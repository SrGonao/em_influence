# The SPAR/EleutherAI lab Slurm cluster's protected lane (partition a40, QoS high), through
# snakemake-executor-plugin-slurm: `uv run --with "snakemake-executor-plugin-slurm>=2.8,<3" snakemake
# --profile workflow/profiles/lab-protected ...`. README.md's "Run on a Slurm cluster" explains the lanes.
executor: slurm
# The lane's limit on running jobs per person (QoS high also caps CPUs and memory per person at
# 6 and 64G, hence 3 CPUs and 32G per job here).
jobs: 2
# Local rules run on the controller's machine, the shared login node; keep them few at a time.
local-cores: 2
latency-wait: 60
slurm-no-account: true
default-resources:
  slurm_partition: a40
  qos: high
  runtime: 2870
  cpus_per_task: 3
  mem_mb: 32000
