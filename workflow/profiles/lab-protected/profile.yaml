# The SPAR/EleutherAI lab Slurm cluster's protected lane (partition a40, QoS high), through
# snakemake-executor-plugin-slurm: `uv run --with "snakemake-executor-plugin-slurm>=2.8,<3" snakemake
# --profile workflow/profiles/lab-protected ...`. README.md's "Run on a Slurm cluster" explains the lanes.
executor: slurm
# The lane's limit on running jobs per person (QoS high also caps CPUs and memory per person at
# 6 and 64G, hence 3 CPUs and 32G per job here).
jobs: 2
# Local rules run on the controller's machine, the shared login node; keep them few at a time.
local-cores: 2
latency-wait: 60
slurm-no-account: true
default-resources:
  slurm_partition: a40
  qos: high
  runtime: 2870
  cpus_per_task: 3
  mem_mb: 32000
# The CPU-only rules that read or rewrite whole datasets go to the CPU lane. It runs one job per
# person, so for a big batch of masks, build them first in one `lab submit --cpu` job.
set-resources:
  tokenize: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  validate_tokens_cosine: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  token_subset: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  combined_token_subset: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
