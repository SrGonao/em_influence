# The SPAR/EleutherAI lab Slurm cluster's borrow lane (partition a40-borrow, QoS borrow), through
# snakemake-executor-plugin-slurm: `uv run --with snakemake-executor-plugin-slurm snakemake
# --profile workflow/profiles/lab-borrow ...`. README.md's "Run on a Slurm cluster" explains the lanes.
executor: slurm
# The lane's limit on running jobs per person.
jobs: 4
# Local rules run on the controller's machine, the shared login node; keep them few at a time.
local-cores: 2
latency-wait: 60
slurm-no-account: true
default-resources:
  slurm_partition: a40-borrow
  qos: borrow
  runtime: 470
  cpus_per_task: 8
  mem_mb: 96000
# The CPU-only rules that read or rewrite whole datasets go to the CPU lane, which runs one job
# per person, so up to 16 of them share each job.
set-resources:
  tokenize: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  validate_tokens_cosine: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  token_subset: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
  combined_token_subset: {slurm_partition: cpu, qos: cpu, cpus_per_task: 1, runtime: 30}
groups: [tokenize=cpu, validate_tokens_cosine=cpu, token_subset=cpu, combined_token_subset=cpu]
group-components: [cpu=16]
