# The SPAR/EleutherAI lab Slurm cluster's borrow lane (partition a40-borrow, QoS borrow), through
# snakemake-executor-plugin-slurm: `uv run --with "snakemake-executor-plugin-slurm>=2.8,<3" snakemake
# --profile workflow/profiles/lab-borrow ...`. README.md's "Run on a Slurm cluster" explains the lanes.
executor: slurm
# The lane's limit on running jobs per person.
jobs: 4
# Local rules run on the controller's machine, the shared login node; keep them few at a time.
local-cores: 2
latency-wait: 60
slurm-no-account: true
default-resources:
  slurm_partition: a40-borrow
  qos: borrow
  runtime: 470
  cpus_per_task: 8
  mem_mb: 96000
