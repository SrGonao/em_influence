name: window-sharp-check
setup: uv sync --frozen
command: TAG=-sharp8 SHARP=8 SPECS=8+0 bash jobs/window_long.sh && TAG=-sharp4 SHARP=4 SPECS=4+0 bash jobs/window_long.sh && TAG=-sharp8 SHARP=8 WINDOWS="8" bash jobs/window_eval.sh && TAG=-sharp4 SHARP=4 WINDOWS="4" bash jobs/window_eval.sh
gpus: 1
use_shared: true
priority: 60
estimated_runtime_min: 40
max_runtime_min: 180
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
outputs:
  - path: results
auto_preempt: true
