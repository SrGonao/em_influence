name: window-knockout
setup: uv sync --frozen
command: for spec in "1 0" "4 0" "8 0" "8 8"; do set -- $spec; TAG=-knockout-s$2 SHARP=$2 INTERVENTION=knockout WINDOWS=$1 bash jobs/window_eval.sh; done; TAG=-hybrid-s0 INTERVENTION=hybrid WINDOWS="1 8" bash jobs/window_eval.sh
gpus: 1
use_shared: true
priority: 60
estimated_runtime_min: 30
max_runtime_min: 180
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
outputs:
  - path: results
auto_preempt: true
