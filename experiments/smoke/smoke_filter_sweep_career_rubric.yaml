# Smoke-scale Figure 6 ("Rubric-Based Selection"): same three seeds and one
# 20% fraction as the other smoke manifests, but keeps all 5 rubric metrics
# and scores them with the local vLLM judge (Qwen/Qwen3-32B-AWQ) - a fast
# first check of the local-judge path before committing to the full
# ~106 GPU-hr/dataset run in figure6/filter_sweep_career_rubric.yaml.
#
# Deliberately shares results_root with smoke_filter_sweep_career.yaml: same
# dataset/model/seeds/evaluation_suites/generation config, so the baseline
# train+evaluate is reused automatically - run smoke_filter_sweep_career.yaml
# first. (query_suites is unused by the rubric method - it ranks the
# training data directly via the judge, not via an attribution query - the
# full suite here is just for consistency with every other manifest.)
#
# Run with:
#   em-influence run experiments/smoke/smoke_filter_sweep_career_rubric.yaml --dry-run
#   em-influence run experiments/smoke/smoke_filter_sweep_career_rubric.yaml --resume
version: 1
name: smoke_filter_sweep_career_rubric
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/smoke_filter_sweep_career_3seed_no_resample
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2]
generation: {samples_per_prompt: 20}
attribution: {methods: [rubric], bergson_bin: "${BERGSON_BIN}", token_batch_size: 1024, unit_normalize: true}
rubric:
  backend: local
  judge_model: Qwen/Qwen3-32B-AWQ
  metrics: [wrongness, harm_potential, overconfidence, vulnerability, subtlety]
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}  # cuda_devices omitted: auto-detects every GPU on the host
execution:
  enabled: true
