name: token-grid-calibrate
setup: uv sync --frozen
command: cd reports/token_grid && bash calibrate.sh work/calibrate 0 11 20 "8e-7 2000 7000" "5e-6 30 300" "1e-7 1000 1e5" "8e-7 2000 1e5" "8e-7 20000 1e5" "8e-7 2000 1e6"
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
secrets: [HF_TOKEN]
outputs:
  - path: reports/token_grid/work
estimated_runtime_min: 60
cleanup: on_success
