name: token-grid-smoke
setup: uv sync --frozen
command: cd reports/token_grid && uv run --no-sync python bif.py --output work/smoke/chain.npz --draws 3 --burn-in 5 --thin 5
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
secrets: [HF_TOKEN]
outputs:
  - path: reports/token_grid/work
estimated_runtime_min: 5
cleanup: on_success
